apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-web
  labels:
    app.kubernetes.io/name: client-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: client-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client-web
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client-web
          image: client-web
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            # RSC → API 는 클러스터 내부 DNS 로 직접 호출 (Ingress 왕복/egress 비용 제거)
            - name: API_INTERNAL_URL
              # 같은 네임스페이스의 Service 단축 DNS → overlay 에서 네임스페이스가 바뀌어도 수정 불필요
              value: http://server-api
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          # 웹은 백엔드 장애와 무관하게 셸을 렌더링할 수 있어야 하므로 "/" 만 확인 (백엔드 의존 X)
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # Next.js 이미지 최적화/ISR 캐시 쓰기 경로
            - name: next-cache
              mountPath: /app/apps/client-web/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
