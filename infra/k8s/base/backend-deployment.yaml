apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server-api
    app.kubernetes.io/component: backend
spec:
  # replicas 를 지정하지 않는다: HPA 가 소유. 여기 값을 두면 `kubectl apply` 할 때마다
  # HPA 가 늘려 놓은 레플리카 수가 매니페스트 값으로 리셋되어 트래픽 피크에 용량이 급감한다.
  revisionHistoryLimit: 5
  # 새 Pod 가 Ready 후 10초간 크래시 없이 유지되어야 "가용"으로 간주 → 부팅 직후 죽는 버전의 롤아웃 차단
  minReadySeconds: 10
  # 5분 내 롤아웃이 진행되지 않으면 실패로 표시 (CI 에서 `kubectl rollout status` 가 실패를 감지)
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 무중단 배포: 기존 Pod 를 먼저 내리지 않고(0), 새 Pod 를 25% 먼저 띄운다
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      app.kubernetes.io/name: server-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server-api
        app.kubernetes.io/component: backend
    spec:
      # 앱이 k8s API 를 호출하지 않으므로 SA 토큰 마운트 금지 → 컨테이너 탈취 시 클러스터 권한 상승 차단
      automountServiceAccountToken: false
      # preStop(10s) + 앱 graceful shutdown 여유
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # 같은 노드/존에 몰리지 않게 분산 → 노드 1대 장애가 서비스 전체 장애가 되지 않도록
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: server-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: server-api
      containers:
        - name: server-api
          image: server-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: server-api-config
            - secretRef:
                name: server-api-secrets
          resources:
            requests:
              # HPA 의 CPU 사용률(%)은 requests 대비로 계산된다 → requests 가 없으면 HPA 가 동작하지 않는다
              cpu: 200m
              memory: 256Mi
            limits:
              # CPU limit 은 CFS throttling 으로 p99 지연을 유발할 수 있다.
              # 노이지 네이버 방지가 더 중요하면 유지, 지연 민감 서비스면 제거를 검토.
              cpu: '1'
              memory: 512Mi
          # ── Probes ───────────────────────────────────────────────────────
          # startupProbe: 부팅(DB 재시도 포함)이 끝날 때까지 liveness 를 유예 → 느린 부팅을 "죽음"으로 오판해 재시작 루프에 빠지는 것 방지
          #   최대 대기 = periodSeconds(5) × failureThreshold(24) = 120s
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          # livenessProbe: "프로세스가 응답 불능(데드락/이벤트 루프 블로킹)"일 때만 재시작
          #   ⚠️ 외부 의존성(DB)을 보면 안 된다 — DB 장애 시 모든 Pod 동시 재시작 → 장애 증폭
          #   30초(10s × 3) 연속 실패 시에만 재시작 → GC pause 등 일시 지연에 과민 반응하지 않음
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readinessProbe: 트래픽 수신 가능 여부 (DB/Redis/Memory 포함)
          #   실패 시 재시작하지 않고 Service 엔드포인트에서만 제외 → 의존성 복구 시 자동 복귀
          #   timeoutSeconds(3s) > 앱 내부 타임아웃(HEALTH_CHECK_TIMEOUT_MS=1.5s)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          lifecycle:
            # SIGTERM 전 대기: Endpoint 제거가 kube-proxy/Ingress 에 전파되기 전에 프로세스가 종료되면
            # 이미 라우팅된 요청이 502 가 된다 (롤링 업데이트 중 간헐적 에러의 대표 원인)
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 10']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # readOnlyRootFilesystem 환경에서 Node/라이브러리가 임시 파일을 쓸 수 있는 유일한 경로
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
