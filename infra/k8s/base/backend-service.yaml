apiVersion: v1
kind: Service
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server-api
spec:
  # 클러스터 내부 전용. 외부 노출은 Ingress 단일 진입점으로만
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
