# 모든 upstream location 에 공통 적용되는 프록시 헤더 (DRY: server 블록마다 복붙 금지)
#
# 왜 http 블록이 아니라 include 스니펫인가?
#   proxy_set_header / add_header 는 하위 블록에서 "하나라도" 선언하면 상위 블록의 선언이 전부 상속되지 않는다.
#   location 별로 헤더를 추가하는 순간 X-Forwarded-* 가 조용히 사라지는 사고를 막기 위해 명시적으로 include 한다.
#   (타임아웃처럼 덮어쓰기가 필요한 값은 nginx.conf 의 http 블록에 둔다 — 같은 블록에서 중복 선언 불가)

# HTTP/1.1: upstream keepalive 및 WebSocket Upgrade 에 필수
proxy_http_version 1.1;

# ── 원본 요청 정보 보존 ──
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Nginx 가 엣지(최전단)이므로 클라이언트가 보낸 X-Forwarded-For 를 이어붙이지 않고 덮어쓴다.
# ($proxy_add_x_forwarded_for 를 쓰면 클라이언트가 IP 를 위조해 Rate limit / 감사 로그를 우회할 수 있다)
# 앞단에 LB 가 하나 더 있다면 set_real_ip_from + $proxy_add_x_forwarded_for 로 바꾼다.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-ID      $req_id;

# ── WebSocket ── (map 으로 계산된 값: Upgrade 요청이면 "upgrade", 아니면 keepalive 유지)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 응답 헤더의 요청 ID 를 Nginx 값으로 통일 (Nginx 자체 502 응답에도 ID 가 붙도록)
proxy_hide_header X-Request-ID;
add_header X-Request-ID $req_id always;
