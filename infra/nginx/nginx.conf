# ─────────────────────────────────────────────────────────────────────────────
# Phase 2: Edge Reverse Proxy
#   api.local.dev → server-api:3000 (NestJS)
#   web.local.dev → client-web:3001 (Next.js)
# 호스트 /etc/hosts:  127.0.0.1  api.local.dev web.local.dev
# ─────────────────────────────────────────────────────────────────────────────
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 에러 페이지/헤더에서 Nginx 버전 숨김
  server_tokens off;

  # ── 요청 추적 ID ──
  # 클라이언트가 보낸 ID 가 있으면 재사용(분산 추적 연계), 없으면 Nginx 가 생성
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # ── WebSocket ──
  # Upgrade 헤더가 없으면 Connection 헤더를 비워 upstream keepalive 를 유지한다 ("close" 로 두면 매 요청 TCP 재연결)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  log_format main escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
    '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  # 컨테이너 표준: stdout/stderr 로 출력 → docker logs / 로그 수집기가 수거
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile           on;
  tcp_nopush         on;
  keepalive_timeout  65s;
  # 업로드 상한: 초과 시 413. 무제한이면 대용량 요청으로 디스크/메모리 고갈(DoS) 위험
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

  # ── Docker 내장 DNS ──
  # 컨테이너가 재생성되어 IP 가 바뀌어도 upstream 을 재해석한다 (`resolve` 파라미터와 짝).
  # 이것이 없으면 Nginx 는 부팅 시 해석한 IP 를 영원히 캐시 → 재배포 후 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_upstream {
    zone api_upstream 64k;
    server server-api:3000 resolve;
    # upstream 커넥션 재사용 → 요청마다 TCP 핸드셰이크 비용 제거
    keepalive 32;
  }

  upstream web_upstream {
    zone web_upstream 64k;
    server client-web:3001 resolve;
    keepalive 16;
  }

  # ── 프록시 타임아웃 (location 에서 개별 재정의 가능) ──
  # upstream 이 응답하지 않을 때 워커 커넥션이 무한정 묶이는 것을 방지
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;
  # upstream 실패 시 다음 서버로 재시도 (nginx 는 기본적으로 POST 등 비멱등 요청은 재시도하지 않음)
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  # ── Rate limiting (IP 기준) ── 무차별 대입/스크래핑 1차 방어선
  limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;
  limit_req_status 429;

  # ── Default server ──
  # 정의되지 않은 Host 헤더 요청은 응답 없이 연결 종료 → Host 헤더 공격/스캐너 차단
  server {
    listen 80 default_server;
    server_name _;

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 444;
    }
  }

  # ── API ──
  server {
    listen 80;
    # 모바일 전용 진입점: Android 에뮬레이터/실기기는 호스트의 /etc/hosts 를 쓰지 못해 Host 기반 라우팅이 불가하다.
    # 8080 은 이 server 블록이 유일(=default)하므로 Host 와 무관하게 API 로 전달된다. (예: http://10.0.2.2:8080)
    listen 8080;
    server_name api.local.dev;

    # upstream 이 다운되면 Nginx 기본 HTML 대신 RFC 7807 JSON 을 반환 → 클라이언트 파서 일관성 유지
    error_page 502 503 504 = @api_unavailable;

    location / {
      limit_req zone=api_rl burst=40 nodelay;
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_pass http://api_upstream;
    }

    # 헬스체크는 고빈도 호출 → 접근 로그 제외, rate limit 제외
    location /api/v1/health {
      access_log off;
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_pass http://api_upstream;
    }

    # WebSocket(Socket.IO / ws) 은 장시간 유휴 연결 → read timeout 을 늘린다
    location /ws/ {
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_pass http://api_upstream;
    }

    location @api_unavailable {
      default_type application/problem+json;
      add_header X-Request-ID $req_id always;
      return 503 '{"type":"urn:problem-type:service-unavailable","title":"Service Unavailable","status":503,"detail":"The API server is temporarily unavailable.","requestId":"$req_id"}';
    }
  }

  # ── Web ──
  server {
    listen 80;
    server_name web.local.dev;

    location / {
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_pass http://web_upstream;
    }

    # /_next/static/* 은 Next.js 가 이미 `Cache-Control: public, max-age=31536000, immutable` 을 붙인다.
    # 여기서 add_header 로 또 추가하면 헤더가 중복되어 CDN/프록시마다 해석이 달라지므로 Nginx 는 관여하지 않는다.
    # (Nginx 레벨 캐싱이 필요하면 proxy_cache 를 이 location 에 추가)

    # Next.js HMR (next dev 를 프록시할 경우) WebSocket
    location /_next/webpack-hmr {
      include /etc/nginx/snippets/proxy-common.conf;
      proxy_read_timeout 3600s;
      proxy_pass http://web_upstream;
    }
  }
}
