# 검증 파이프라인.
#
# 설계 원칙
#   1. CI 는 로컬과 **같은 명령**을 돌린다. `scripts/` 의 스크립트를 호출할 뿐이고 CI 안에 로직을 두지 않는다.
#      그래야 "로컬은 통과하는데 CI 만 실패" 또는 그 반대가 생기지 않는다.
#   2. 이슈 로그의 "검증했다" 기록을 믿지 않고 직접 다시 돌린다. 기록은 참고용이고 판정은 CI 가 한다.
#   3. 모바일·인프라 검증은 해당 파일이 바뀐 경우에만 돌린다 (Flutter SDK 설치가 수 분 걸린다).
name: CI

# 모든 브랜치의 push 에서 돈다. PR 이 열리기 전에도 피드백을 받을 수 있어야 하고,
# 기능 브랜치에 직접 push 하는 흐름에서도 검증이 비지 않는다.
# 포크에서 온 PR 은 push 이벤트가 이 저장소에 오지 않으므로 pull_request 로 따로 받고,
# 같은 저장소 브랜치의 PR 은 push 로 이미 검증됐으므로 `skip-duplicate` 에서 걸러낸다.
on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 ref 에 새 푸시가 오면 진행 중인 실행을 취소한다 (러너 시간 낭비 방지).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1) 이 실행을 계속할지, 2) 어떤 영역이 바뀌었는지를 한 job 에서 판단한다.
  # 뒤 job 들은 이 출력만 보고 자신을 돌릴지 결정하므로, 조건이 한 곳에 모인다.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.duplicate.outputs.run }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - id: duplicate
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = "true" ] && [ "$SAME_REPO" = "true" ]; then
            echo "같은 저장소 브랜치의 PR → push 이벤트로 이미 검증됨. 건너뜀"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.duplicate.outputs.run == 'true'
        with:
          # 변경 비교를 위해 기준 커밋이 필요하다
          fetch-depth: 0
      - id: filter
        if: steps.duplicate.outputs.run == 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD~1...HEAD)"
          else
            # 첫 커밋: 전부 바뀐 것으로 본다
            changed="$(git ls-files)"
          fi
          printf '변경된 파일:\n%s\n' "$changed"
          match() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          {
            echo "mobile=$(match '^apps/client-mobile/|^scripts/templates/')"
            echo "infra=$(match '^infra/|^scripts/(validate-k8s|setup-toolchain|ensure-tools)\.sh$')"
            echo "contracts=$(match '^packages/shared-types/|^apps/client-mobile/lib/')"
          } >> "$GITHUB_OUTPUT"

  issues:
    name: 이슈 절차
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/validate-issues.sh

  verify:
    name: lint · typecheck · test · format
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm format:check

  contracts:
    name: 계약 드리프트
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:contracts

  k8s:
    name: K8s 매니페스트
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # 도구 설치는 스크립트가 알아서 한다 (버전·체크섬이 로컬과 같아야 결과가 같다)
      - run: bash scripts/validate-k8s.sh

  mobile:
    name: Flutter
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Flutter 설치가 가장 오래 걸린다. 그래서 이 job 은 모바일·템플릿 변경이 있을 때만 돈다.
      - run: pnpm mobile:analyze
      - run: pnpm mobile:test

  # 생성기 템플릿이 공통 코드 변경으로 낡지 않았는지. 임시 도메인을 만들어 전체 검증 후 되돌린다.
  scaffold:
    name: 생성기 템플릿
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # verify-scaffold.sh 가 turbo·tsc 를 돌리므로 의존성이 먼저 있어야 한다.
      # (처음 작성 때 이 단계를 빠뜨려 "shared-types 빌드 실패" 로 CI 가 떨어졌다)
      - run: pnpm install --frozen-lockfile
      - name: Flutter 설치 (모바일 템플릿도 검증할 때만)
        if: needs.plan.outputs.mobile == 'true'
        run: bash scripts/setup-toolchain.sh --with-flutter
      # flutter 가 없으면 verify-scaffold.sh 가 모바일 검증을 "미실행" 으로 알리고 나머지를 계속한다
      - run: bash scripts/verify-scaffold.sh
